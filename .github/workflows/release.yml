name: release

# Publishing is triggered by publishing a GitHub Release. The npm auth is
# trusted publishing (OIDC): no NPM_TOKEN, no access token, no 2FA prompt.
# Configure the trusted publisher once on npmjs.com (see docs/releasing.md).
on:
  release:
    types: [published]

permissions:
  id-token: write # the OIDC handshake with npm
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # Node 24 ships npm 11+, which speaks the OIDC handshake.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the release matches the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package version $version" >&2; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: Full check gate
        run: bun run check

      - name: Publish to npm (OIDC, provenance attached)
        run: npm publish --access public
