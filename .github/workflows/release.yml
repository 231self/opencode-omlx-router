name: release

# Publishing is triggered by publishing a GitHub Release. CI validates and
# STAGES the version over npm trusted publishing (OIDC) — no NPM_TOKEN, no
# access token. A maintainer then reviews and approves the staged version
# with 2FA (npm stage approve, or the Staged Packages tab on npmjs.com), so
# nothing reaches the registry without a human decision.
on:
  release:
    types: [published]

permissions:
  id-token: write # the OIDC handshake with npm
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # Base image for the runner; npm itself is pinned below.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Staged publishing needs npm >= 11.15 and the OIDC flow needs >= 11.5.1.
      # Pinned deliberately: bump it together with reading the npm changelog.
      - name: Pin npm
        run: npm install -g npm@12.2.3 && npm --version

      - name: Verify the release matches the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package version $version" >&2; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: Full check gate
        run: bun run check

      - name: Stage the version for approval (OIDC, provenance attached)
        run: npm stage publish --access public
